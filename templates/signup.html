{% extends "base.html" %}{% block body %}
<div class="auth">
  <div class="card">
    <h1>Create account</h1>
    <p class="sub">Create your encrypted QueryPilot AI account.</p>
    {% include "_flashes.html" %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="name">Full Name</label>
      <input id="name" name="name" autocomplete="name" maxlength="100" required autofocus>
      <label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="email" maxlength="254" required>
      <label for="password">Password (min 8 chars, include a letter &amp; number/symbol)</label>
      <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <button class="full" type="submit">Sign up</button>
    </form>
  </div>
  <div class="foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></div>
</div>
{% endblock %}
