{% extends "base.html" %}{% block body %}
<div class="auth"><div class="card"><h1>Create account</h1><p class="sub">We'll email you a link to confirm it.</p>
{% include "_flashes.html" %}
<form method="post"><label>Name</label><input name="name" required autofocus>
<label>Email</label><input type="email" name="email" required>
<label>Password (min 8 characters)</label><input type="password" name="password" minlength="8" required>
<button class="full">Sign up</button></form></div>
<div class="foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></div></div>
{% endblock %}
