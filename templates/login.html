{% extends "base.html" %}{% block body %}
<div class="auth">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to generate SQL for any domain in plain English.</p>
    {% include "_flashes.html" %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="email" required autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
      <button class="full" type="submit">Sign in</button>
    </form>
  </div>
  <div class="foot">New here? <a href="{{ url_for('signup') }}">Create an account</a> · <a href="{{ url_for('resend') }}">Resend confirmation</a></div>
</div>
{% endblock %}
