{% extends "base.html" %}{% block body %}
<div class="auth clerk-wrap">
  {% include "_flashes.html" %}
  <div id="clerk-sign-in"><div class="card" style="text-align:center"><p class="sub">Loading sign-in…</p></div></div>
</div>
<script>
window.addEventListener("load", async function () {
  const box = document.getElementById("clerk-sign-in");
  if (!window.Clerk) {
    box.innerHTML = '<div class="card"><div class="flash error">Clerk SDK failed to load. Check CLERK_PUBLISHABLE_KEY.</div></div>';
    return;
  }
  await window.Clerk.load();
  if (window.Clerk.session) {
    const token = await window.Clerk.session.getToken();
    const u = window.Clerk.user;
    const email = u && u.primaryEmailAddress ? u.primaryEmailAddress.emailAddress : "";
    const name = u ? (u.fullName || u.firstName || "") : "";
    const r = await fetch("{{ url_for('auth_session') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, email, name })
    });
    const d = await r.json();
    if (d.ok && d.redirect) { window.location.replace(d.redirect); return; }
  }
  box.innerHTML = "";
  window.Clerk.mountSignIn(box, {
    signUpUrl: "{{ url_for('signup') }}",
    fallbackRedirectUrl: "{{ url_for('auth_callback') }}",
    appearance: { variables: { colorPrimary: "#4f46e5", borderRadius: "10px" } }
  });
});
</script>
{% endblock %}
