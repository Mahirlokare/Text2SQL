{% extends "base.html" %}{% block body %}
<div class="auth"><div class="card" style="text-align:center">
  <h1 id="title">Completing sign-in…</h1>
  <p class="sub" id="msg">Verifying your Clerk session…</p>
  <a class="btn alt" id="back" href="{{ url_for('login') }}" style="display:none">Back to sign in</a>
</div></div>
<script>
window.addEventListener("load", async function () {
  const title = document.getElementById("title");
  const msg = document.getElementById("msg");
  const back = document.getElementById("back");
  try {
    if (!window.Clerk) throw new Error("Clerk SDK unavailable.");
    await window.Clerk.load();
    if (!window.Clerk.session) {
      window.location.replace("{{ url_for('login') }}");
      return;
    }
    const token = await window.Clerk.session.getToken();
    const u = window.Clerk.user;
    const email = u && u.primaryEmailAddress ? u.primaryEmailAddress.emailAddress : "";
    const name = u ? (u.fullName || u.firstName || "") : "";
    const r = await fetch("{{ url_for('auth_session') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, email, name })
    });
    const d = await r.json();
    if (d.ok && d.redirect) {
      window.location.replace(d.redirect);
    } else {
      throw new Error(d.error || "Could not verify session.");
    }
  } catch (e) {
    title.textContent = "Sign-in verification error";
    msg.textContent = e.message || String(e);
    back.style.display = "inline-block";
  }
});
</script>
{% endblock %}
