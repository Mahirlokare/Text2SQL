<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QueryPilot AI</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% if clerk_pk and clerk_fapi %}
<script async crossorigin="anonymous" data-clerk-publishable-key="{{ clerk_pk }}"
        src="https://{{ clerk_fapi }}/npm/@clerk/clerk-js@5/dist/clerk.browser.js" type="text/javascript"></script>
{% endif %}
</head><body>
<div class="nav"><div class="logo">Query<span>Pilot</span> AI</div>
<div class="nav-right">{% if session.uid %}<span>Hi, {{ session.name }}</span><div id="clerk-user-btn"></div><a href="{{ url_for('logout') }}">Sign out</a>{% endif %}</div></div>
{% block body %}{% endblock %}
{% if session.uid and clerk_pk %}
<script>
window.addEventListener("load", async function () {
  if (window.Clerk) {
    await window.Clerk.load();
    const el = document.getElementById("clerk-user-btn");
    if (el && window.Clerk.user) {
      window.Clerk.mountUserButton(el, { afterSignOutUrl: "{{ url_for('logout') }}" });
    }
  }
});
</script>
{% endif %}
</body></html>
