services:
  - type: web
    name: querypilot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_db.py
    startCommand: gunicorn web:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
