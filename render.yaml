services:
  - type: web
    name: querypilot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_db.py
    startCommand: gunicorn web:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AUTH0_SECRET
        generateValue: true
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      - key: AUTH0_REDIRECT_URI
        value: https://querypilot-ai-g3rf.onrender.com/callback
      - key: GEMINI_API_KEY
        sync: false
